name: Build Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run tests
      run: ./gradlew test

    - name: Create runtime image
      run: ./gradlew jlink

    - name: Create DEB installer
      run: ./gradlew jpackage -PinstallerType=deb

    - name: Create RPM installer
      run: ./gradlew jpackage -PinstallerType=rpm

    - name: Upload DEB package
      uses: actions/upload-artifact@v4
      with:
        name: winnow-linux-deb
        path: build/jpackage/*.deb

    - name: Upload RPM package
      uses: actions/upload-artifact@v4
      with:
        name: winnow-linux-rpm
        path: build/jpackage/*.rpm

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run tests
      run: ./gradlew test

    - name: Create runtime image
      run: ./gradlew jlink

    - name: Create MSI installer
      run: ./gradlew jpackage -PinstallerType=msi

    - name: Upload MSI installer
      uses: actions/upload-artifact@v4
      with:
        name: winnow-windows-msi
        path: build/jpackage/*.msi

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run tests
      run: ./gradlew test

    - name: Create runtime image
      run: ./gradlew jlink

    - name: Create DMG installer
      run: ./gradlew jpackage -PinstallerType=dmg

    - name: Upload DMG installer
      uses: actions/upload-artifact@v4
      with:
        name: winnow-macos-dmg
        path: build/jpackage/*.dmg

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          winnow-linux-deb/*.deb
          winnow-linux-rpm/*.rpm
          winnow-windows-msi/*.msi
          winnow-macos-dmg/*.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
