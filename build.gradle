plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
    id 'org.teavm' version '0.10.1'
}

version = '0.8.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

application {
    mainModule = 'org.win'
    mainClass = project.hasProperty('mainClass') ? project.getProperty('mainClass') : 'org.win.Main'
    applicationDefaultJvmArgs = [
        // Suppress harmless GTK/JavaFX interaction warnings on Linux
        '-Dprism.verbose=false',
        '-Djavafx.verbose=false',
        // Allow module to read from unnamed modules (Clojure, commons-io) at runtime
        '--add-reads', 'org.win=ALL-UNNAMED'
    ]
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.swing']
}

jlink {
    options = ['--strip-debug', '--compress=2', '--no-header-files', '--no-man-pages']

    // Merge all non-modular dependencies into the application module
    forceMerge 'clojure', 'ij', 'commons', 'smoosh', 'opencv'

    launcher {
        name = 'winnow'
    }

    jpackage {
        imageName = 'Winnow'
        def iconPath = project.file('src/main/resources/org/win/wheat.ico').absolutePath

        // Mac jpackage doesn't accept versions starting with 0, so transform 0.x.y to 1.x.y for Mac only
        def macVersion = project.version.startsWith('0.') ? '1.' + project.version.substring(2) : project.version
        def osName = System.getProperty("os.name").toLowerCase()

        // Set imageOptions with appropriate version for the platform
        if (osName.contains("mac")) {
            imageOptions = ['--icon', iconPath, '--app-version', macVersion]
        } else {
            imageOptions = ['--icon', iconPath, '--app-version', project.version]
        }

        installerType = project.hasProperty('installerType') ? project.getProperty('installerType') : null

        def commonOptions = [
            '--vendor', 'Winnow',
            '--description', 'Destructive bulk image editor',
            '--copyright', 'Copyright 2025'
        ]

        installerOptions = commonOptions

        if (osName.contains("win")) {
            installerOptions += [
                '--app-version', project.version,
                '--win-dir-chooser',
                '--win-menu',
                '--win-menu-group', 'Iondrive',
                '--win-shortcut',
                '--icon', iconPath
            ]
        } else if (osName.contains("mac")) {
            installerOptions += [
                '--app-version', macVersion,
                '--mac-package-name', 'Winnow'
            ]
        } else if (osName.contains("linux")) {
            installerOptions += [
                '--app-version', project.version,
                '--linux-shortcut'
            ]
        }
    }
}

dependencies {
    implementation 'net.imagej:ij:1.53v'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'org.clojure:clojure:1.11.3'
    implementation 'com.github.iondrive-co:classifile:0.3.0'
    implementation 'com.github.iondrive-co:smoosh:0.2.1'
    implementation 'org.openpnp:opencv:4.9.0-0'  // Required by smoosh for person detection

    // TeaVM/JSO only used by web stub; keep it compileOnly to avoid inflating desktop runtime
    compileOnly 'org.teavm:teavm-jso:0.10.1'
    compileOnly 'org.teavm:teavm-classlib:0.10.1'
    compileOnly 'org.teavm:teavm-cli:0.10.1'

    testImplementation 'org.assertj:assertj-core:3.23.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.htmlunit:htmlunit:4.5.0'
}

// Separate source set for web transpilation to avoid touching the modular desktop app
sourceSets {
    web {
        java {
            srcDir 'src/web/java'
        }
        compileClasspath += sourceSets.main.output + configurations.webImplementation + configurations.webCompileOnly + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.webRuntimeOnly
    }
}

configurations {
    webImplementation {
        canBeResolved = true
    }
    webCompileOnly {
        extendsFrom compileOnly
        canBeResolved = true
    }
    webRuntimeOnly {
        canBeResolved = true
    }
    webRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    webImplementation 'org.teavm:teavm-jso:0.10.1'
    webImplementation 'org.teavm:teavm-classlib:0.10.1'
    webRuntimeOnly 'org.teavm:teavm-cli:0.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked'
    if (name == 'compileJava') {
        // Allow module to read from unnamed modules (Clojure, commons-io)
        options.compilerArgs << '--add-reads'
        options.compilerArgs << 'org.win=ALL-UNNAMED'
    }
}

// Handle duplicate resources in jar
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Configure IntelliJ IDEA to use Gradle for builds
idea {
    module {
        inheritOutputDirs = false
        outputDir = file("$buildDir/classes/java/main")
        testOutputDir = file("$buildDir/classes/java/test")
    }
}

test {
    maxParallelForks = 1
    forkEvery = 1  // Fork a new JVM for each test class to prevent JavaFX thread exhaustion

    // JVM args - suppress warnings in all environments
    jvmArgs = [
        '-Dprism.verbose=false',
        '-Djavafx.verbose=false'
    ]

    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

// Task to generate screenshot for README
tasks.register('generateScreenshot', JavaExec) {
    group = 'documentation'
    description = 'Generates a screenshot of the application for README'

    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.win.test.ScreenshotGenerator'

    doFirst {
        // Put only JavaFX jars on the module-path; keep everything else on the classpath
        def fxJars = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-') }
        jvmArgs = ['--module-path', fxJars.asPath, '--add-modules', 'javafx.controls,javafx.swing']
    }

    def screenshotFile = file("${projectDir}/docs/winnow-screenshot.png")
    args screenshotFile.absolutePath, project.version

    doFirst {
        // Ensure docs directory exists
        file("${projectDir}/docs").mkdirs()
        println "Generating screenshot (requires graphical environment)..."
    }

    doLast {
        println "Screenshot generated at: ${screenshotFile.absolutePath}"
    }
}

// Task to update README with screenshot
tasks.register('updateReadmeScreenshot') {
    group = 'documentation'
    description = 'Updates README.md with the latest screenshot'

    dependsOn generateScreenshot

    def readmeFile = file("${projectDir}/Readme.md")
    def screenshotFile = file("${projectDir}/docs/winnow-screenshot.png")
    def screenshotPath = 'docs/winnow-screenshot.png'

    doLast {
        if (!readmeFile.exists()) {
            throw new GradleException("README.md not found")
        }

        if (!screenshotFile.exists()) {
            throw new GradleException("Screenshot not found. Run 'generateScreenshot' first.")
        }

        def readmeContent = readmeFile.text
        def screenshotMarkdown = "\n![Winnow Screenshot](${screenshotPath})\n"

        // Insert screenshot after the first heading (# Winnow)
        def updated = false
        def lines = readmeContent.readLines()
        def newLines = []

        for (int i = 0; i < lines.size(); i++) {
            newLines.add(lines[i])

            // Insert after first heading if not already there
            if (!updated && lines[i].startsWith('# Winnow') && (i + 1 >= lines.size() || !lines[i + 1].contains('winnow-screenshot.png'))) {
                // Skip existing screenshot if present
                if (i + 2 < lines.size() && lines[i + 2].contains('winnow-screenshot.png')) {
                    i += 2 // Skip the old screenshot lines
                }
                newLines.add('')
                newLines.add("![Winnow Screenshot](${screenshotPath})")
                newLines.add('')
                updated = true
            } else if (lines[i].contains('winnow-screenshot.png') && i > 0) {
                // Update existing screenshot reference
                newLines[newLines.size() - 1] = "![Winnow Screenshot](${screenshotPath})"
                updated = true
            }
        }

        if (updated) {
            readmeFile.text = newLines.join('\n')
            println "README.md updated with screenshot"
        } else {
            println "Screenshot reference already exists in README.md"
        }
    }
}

// ============================================================================
// Web Build Tasks
// ============================================================================

def webAppDir = file("${buildDir}/web/dist/app")

task transpileWeb(type: JavaExec) {
    group = 'web'
    description = 'Transpile the web app to JavaScript with TeaVM CLI'

    dependsOn compileWebJava

    classpath = sourceSets.web.runtimeClasspath
    mainClass = 'org.teavm.cli.TeaVMRunner'
    args '-t', 'javascript',
         '-d', webAppDir.absolutePath,
         '-f', 'winnow.js',
         '-G',
         'org.win.browser.BrowserMain'

    doFirst {
        webAppDir.mkdirs()
        println "Transpiling web stub with TeaVM -> ${webAppDir}/winnow.js"
    }
}

tasks.register('buildWeb') {
    group = 'web'
    description = 'Build the web version'

    dependsOn assemble
    dependsOn transpileWeb

    def webDir = file("${buildDir}/web")
    def distDir = file("${webDir}/dist")

    doFirst {
        println "Building web version..."
        distDir.mkdirs()
    }

    doLast {
        // Create index.html
        def indexHtml = '''<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winnow Web</title>
</head>
<body>
  <div id="fallback" style="font-family: Arial, sans-serif; padding: 32px;">
    <h2>Winnow Web</h2>
    <p>If you see this, the web bundle failed to load. Please check the browser console.</p>
  </div>
  <script src="app/winnow.js"></script>
  <script>
    (function() {
      function tryMain(entry) {
        try {
          entry && entry([]);
          return true;
        } catch (e) {
          console.error('Failed to start app via entrypoint', e);
          return false;
        }
      }
      if (typeof main === 'function' && tryMain(main)) {
        return;
      }
      if (typeof $rt_exports !== 'undefined' && typeof $rt_exports.main === 'function' && tryMain($rt_exports.main)) {
        return;
      }
      if (typeof self !== 'undefined' && typeof self.main === 'function') {
        tryMain(self.main);
      }
    })();
  </script>
</body>
</html>'''

        file("${distDir}/index.html").text = indexHtml

        def transpiledJs = file("${distDir}/app/winnow.js")
        if (!transpiledJs.exists()) {
            println "TeaVM output not found; writing fallback JS stub."
            transpiledJs.text = """(function(){const body=document.body;const shell=document.createElement('div');shell.innerHTML='<h2>Winnow web build</h2><p>TeaVM transpilation did not run. Replace app/winnow.js with transpiled output.</p>';body.appendChild(shell);})();"""
        }

        println ""
        println "================================================"
        println "Web build complete!"
        println "Location: ${distDir.absolutePath}"
        println "To test: ./gradlew runWeb"
        println "================================================"
    }
}

tasks.register('runWeb', Exec) {
    group = 'web'
    description = 'Start a local web server on a random ephemeral port'

    dependsOn buildWeb

    def distDir = file("${buildDir}/web/dist")

    workingDir distDir

    doFirst {
        // Find an available ephemeral port
        def port
        if (project.hasProperty('port')) {
            port = project.property('port')
        } else {
            // Use a ServerSocket with port 0 to get a random available port
            def serverSocket = new ServerSocket(0)
            port = serverSocket.getLocalPort()
            serverSocket.close()
        }

        def pythonCmd = ['python3', 'python'].find { cmd ->
            try {
                def proc = new ProcessBuilder(cmd, '--version')
                    .redirectErrorStream(true)
                    .start()
                proc.waitFor() == 0
            } catch (Exception ignored) {
                false
            }
        }
        if (pythonCmd == null) {
            throw new GradleException("Python is required to run the web server. Please install Python 3.")
        }
        commandLine pythonCmd, '-m', 'http.server', port

        println ""
        println "================================================"
        println "Starting web server at http://localhost:${port}"
        println "Serving: ${distDir.absolutePath}"
        println "Open http://localhost:${port} in your browser"
        println "Press Ctrl+C to stop"
        println "================================================"
        println ""
    }
}
